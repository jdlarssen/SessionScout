name: Verify SessionScout

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install --yes lua5.1
      - name: Check Lua syntax
        run: find SessionScout tests -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p
      - name: Test model behavior
        run: lua5.1 tests/model_spec.lua
      - name: Test WoW integration adapter
        run: lua5.1 tests/integration_spec.lua
      - name: Verify the local gear evidence experiment
        run: python experiments/GearEvidencePilot/tests/verify.py
      - name: Test release packaging and ranking observations
        run: python -m unittest discover -s tests -p '*_spec.py' -v
      - name: Build local release candidate
        run: python tools/build.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: SessionScout-forever-alpha
          path: |
            dist/*-forever.zip
            dist/*-forever.zip.sha256
          if-no-files-found: error
